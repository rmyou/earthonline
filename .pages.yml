# 用途：定义 Pages CMS 后台表单和可编辑字段。
# 编辑：在 Pages CMS 配置变化时修改；日常文章、背景图、音乐和摄影作品请在网页后台完成，不要直接改这里。
media:
  - input: public/uploads
    output: /earthonline/uploads
  - input: public/music
    output: /earthonline/music
  - input: public/photography
    output: /earthonline/photography

content:
  - name: posts
    label: 文章
    type: collection
    path: src/content/posts
    filename:
      template: "{year}-{month}-{day}-{primary}.md"
      field: create
    fields:
      - name: title
        label: 标题
        type: string
      - name: description
        label: 摘要
        type: text
        required: true
      - name: pubDatetime
        label: 发布时间
        type: date
        options:
          time: true
      - name: tags
        label: 标签
        type: string
        list: true
      - name: draft
        label: 草稿
        type: boolean
        default: false
      - name: featured
        label: 精选
        type: boolean
        default: false
      - name: ogImage
        label: 分享图
        type: image
      - name: body
        label: 正文
        type: rich-text

  - name: pages
    label: 页面
    type: collection
    path: src/content/pages
    filename: "{primary}.md"
    fields:
      - name: title
        label: 页面标题
        type: string
      - name: description
        label: 页面摘要
        type: text
      - name: body
        label: 正文
        type: rich-text

  - name: photography
    label: 摄影作品
    type: file
    path: src/data/photography.json
    format: json
    fields:
      - name: photos
        label: 作品列表
        type: object
        list: true
        fields:
          - name: title
            label: 标题
            type: string
          - name: image
            label: 照片（先在媒体库选择 photography 目录上传）
            type: image
          - name: date
            label: 拍摄日期
            type: date
            required: false
          - name: location
            label: 拍摄地点
            type: string
            required: false
          - name: description
            label: 作品说明
            type: text
            required: false
          - name: draft
            label: 隐藏该作品
            type: boolean
            default: false

  - name: music
    label: 背景音乐
    type: file
    path: src/data/music.json
    format: json
    fields:
      - name: enabled
        label: 显示播放器
        type: boolean
        default: true
      - name: autoplay
        label: 尝试自动播放（浏览器通常会拦截，仅在访客首次点击后生效）
        type: boolean
        default: false
      - name: tracks
        label: 曲目列表
        type: object
        list: true
        fields:
          - name: title
            label: 曲名
            type: string
          - name: artist
            label: 作者 / 来源
            type: string
            required: false
          - name: src
            label: 音频文件（先在媒体库选择 music 目录上传，支持 mp3 / m4a / ogg）
            type: file
          - name: cover
            label: 封面图片（可选）
            type: image
            required: false

  - name: site-settings
    label: 站点设置
    type: file
    path: src/data/site-settings.json
    format: json
    fields:
      - name: site
        label: 基本信息
        type: object
        fields:
          - name: title
            label: 网站名称
            type: string
          - name: description
            label: 网站简介
            type: text
          - name: author
            label: 作者
            type: string
          - name: profile
            label: GitHub 主页
            type: string
      - name: home
        label: 首页文案
        type: object
        required: false
        fields:
          - name: eyebrow
            label: 顶部小标题
            type: string
            required: false
          - name: headline
            label: 主标题
            type: text
            required: false
          - name: subheadline
            label: 副标题
            type: text
            required: false
          - name: intro
            label: 首页说明
            type: text
            required: false
      - name: background
        label: 网页背景
        type: object
        fields:
          - name: image
            label: 背景图片
            type: image
      - name: theme
        label: 主题颜色
        type: object
        fields:
          - name: preset
            label: 配色方案
            type: select
            options:
              values:
                - name: teal
                  label: 蓝青
                - name: ink
                  label: 黑白
                - name: amber
                  label: 暖橙
                - name: forest
                  label: 森林
